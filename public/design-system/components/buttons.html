<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pantessa — Buttons</title>
<style>
  :root { --ink: #0A0A0B; --paper: #FAFAF7; --char: #1C1C1E; --smoke: #6B6B6F; --mist: #C9C9C5; --fog: #EDEDE8; --yeet: #C6FF3D; --yeet-deep: #9BCC1F; --error: #C0392B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Geist", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 48px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--smoke); margin: 0 0 8px; }
  h1 { font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--smoke); font-size: 16px; margin: 0 0 32px; max-width: 60ch; }
  .group { margin-bottom: 28px; }
  .glabel { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--smoke); margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 11px 20px; border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn--primary { background: var(--yeet); color: var(--ink); }
  .btn--primary:hover { background: var(--yeet-deep); }
  .btn--secondary { background: var(--ink); color: var(--paper); }
  .btn--secondary:hover { background: var(--char); }
  .btn--ghost { background: transparent; color: var(--ink); border-color: var(--mist); }
  .btn--ghost:hover { background: var(--fog); }
  .btn--destructive { background: var(--error); color: var(--paper); }
  .btn--sm { font-size: 13px; padding: 8px 14px; }
  .btn--lg { font-size: 17px; padding: 14px 26px; }
  @media (max-width: 720px) { body { padding: 24px; } }
</style>
</head>
<body>
  <p class="eyebrow">Components</p>
  <h1>Buttons</h1>
  <p class="sub">One primary CTA per view. Labels are verbs — "Plug in," "Get paid," not "Submit." 12px radius. Yeet green appears only on the single primary action.</p>

  <div class="group"><div class="glabel">variants</div>
    <div class="row">
      <button class="btn btn--primary">Plug in</button>
      <button class="btn btn--secondary">Add app</button>
      <button class="btn btn--ghost">Cancel</button>
      <button class="btn btn--destructive">Cancel everything</button>
    </div>
  </div>

  <div class="group"><div class="glabel">sizes</div>
    <div class="row">
      <button class="btn btn--primary btn--sm">Get paid</button>
      <button class="btn btn--primary">Get paid</button>
      <button class="btn btn--primary btn--lg">Get paid</button>
    </div>
  </div>

  <div class="group"><div class="glabel">on dark</div>
    <div class="row" style="background:var(--ink);padding:20px;border-radius:16px;">
      <button class="btn btn--primary">Plug in</button>
      <button class="btn btn--ghost" style="color:var(--paper);border-color:#3a3a3d;">Learn more</button>
    </div>
  </div>
</body>
</html>
