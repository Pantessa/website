# The policy pool — Foundry project (self-contained; the website never compiles this).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./deployments.json" }]
remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
