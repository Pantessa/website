name: self-heal routing

# Autonomous self-healing for the sharp router. Picks the highest-impact OPEN
# RouteIncident, runs Claude Code (headless) to investigate + write a MINIMAL
# fix, then opens a PR-only fix that links the incident's logs. NEVER merges —
# a human reviews. The incident state machine (open → dispatched → pr_open)
# guarantees one PR per bug, not one per failure.
#
# Required secrets: ANTHROPIC_API_KEY, DATABASE_URL.
#
# Trigger: manual for now (test it, watch the PRs). Once you trust it, uncomment
# the `schedule` block to let it run on its own.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '23 */3 * * *' # every 3 hours — enable after a successful manual run

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      # 1. Claim the next open incident (locks it → dispatched, writes incident.json).
      - id: claim
        run: pnpm exec tsx scripts/self-heal-claim.ts

      # 2. Let Claude investigate + write a minimal fix + FIX_NOTES.md.
      - name: Investigate and fix
        if: steps.claim.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "$(cat .github/self-heal-prompt.md)" \
            --allowedTools "Bash Edit Read Write Grep Glob" \
            --permission-mode acceptEdits \
            --max-turns 50 || true

      # 3. Commit the agent's edits (if any) and open a PR-only fix.
      - name: Open fix PR
        if: steps.claim.outputs.found == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claim.outputs.branch }}
          SIG: ${{ steps.claim.outputs.signature }}
          INCIDENT_ID: ${{ steps.claim.outputs.id }}
        run: |
          git config user.name "yeetful-self-heal[bot]"
          git config user.email "self-heal@users.noreply.github.com"
          # Capture the agent's notes for the PR body, then keep scratch files
          # OUT of the commit.
          NOTES="(no FIX_NOTES.md written by the agent)"
          if [ -f FIX_NOTES.md ]; then NOTES="$(cat FIX_NOTES.md)"; fi
          rm -f incident.json FIX_NOTES.md
          if [ -z "$(git status --porcelain)" ]; then
            echo "Agent produced no code change — no PR."
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "self-heal: fix $SIG"
          git push -u origin "$BRANCH"
          BODY="$(printf '🤖 Automated self-heal fix for incident \`%s\`.\n\n**Logs (what the user tried → what they got):** https://www.yeetful.com/incidents/%s\n\n---\n\n%s\n\n---\n_PR-only — a human reviews + merges. Generated by the self-heal workflow._' "$SIG" "$INCIDENT_ID" "$NOTES")"
          URL="$(gh pr create --base main --head "$BRANCH" --title "self-heal: fix $SIG" --body "$BODY")"
          echo "pr=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      # 4. Close the loop: record the PR (→ pr_open) or release the lock (→ open).
      - name: Record outcome
        if: steps.claim.outputs.found == 'true'
        run: pnpm exec tsx scripts/self-heal-resolve.ts --id="${{ steps.claim.outputs.id }}" --pr="${{ steps.pr.outputs.pr }}"
